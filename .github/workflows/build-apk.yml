name: Uygulamayı derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Paketleri kur
        run: npm ci

      - name: Android projesini oluştur
        run: npx cap add android

      - name: İkon ve açılış ekranı
        run: npx capacitor-assets generate --android

      - name: Oyun dosyalarını kopyala
        run: npx cap sync android

      - name: Sürüm numarasını ayarla
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Telefona kurulacak APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          mkdir -p ../cikti/apk
          cp app/build/outputs/apk/debug/app-debug.apk ../cikti/apk/esnaf-simulatoru.apk

      - name: Play Store paketi (AAB) oluştur ve imzala
        if: env.KEYSTORE_BASE64 != ''
        run: |
          cd android
          ./gradlew bundleRelease
          cd ..
          echo "$KEYSTORE_BASE64" | base64 -d > upload.jks
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore upload.jks -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
            android/app/build/outputs/bundle/release/app-release.aab upload
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab
          mkdir -p cikti/aab
          cp android/app/build/outputs/bundle/release/app-release.aab cikti/aab/esnaf-simulatoru-play.aab
          rm -f upload.jks

      - name: APK'yı indirilebilir yap
        uses: actions/upload-artifact@v4
        with:
          name: 1-telefona-kur-APK
          path: cikti/apk/esnaf-simulatoru.apk

      - name: AAB'yi indirilebilir yap
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: 2-play-store-AAB
          path: cikti/aab/esnaf-simulatoru-play.aab
